name: "📱 Pedir outro telemóvel"
description: Pede uma versão do MARK 1 SPECTRE para outro modelo de telemóvel.
title: "[Telemóvel] "
labels: ["novo telemóvel"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado pelo interesse! O modelo é paramétrico, por isso com medidas exatas consigo adaptar a tampa a outro telemóvel.
        **Mede com régua ou paquímetro sempre que possível.** As medidas da internet às vezes falham por meio milímetro.
  - type: input
    id: modelo
    attributes:
      label: Modelo do telemóvel
      description: Nome e código exato (está em Definições > Acerca do telefone).
      placeholder: "ex.: Samsung Galaxy S20 (SM-G980F)"
    validations:
      required: true
  - type: input
    id: medidas
    attributes:
      label: Medidas (comprimento × largura × espessura, em mm)
      placeholder: "ex.: 151,7 × 69,1 × 7,9"
    validations:
      required: true
  - type: dropdown
    id: capa
    attributes:
      label: Usas capa?
      options:
        - Não, sem capa
        - Sim, com capa (põe as medidas COM capa em cima)
    validations:
      required: true
  - type: textarea
    id: camara
    attributes:
      label: Câmara de trás
      description: Distância do topo do telemóvel ao início e ao fim do módulo da câmara, a largura do módulo e se está centrada ou num canto.
      placeholder: "ex.: do topo 8 a 32 mm, largura 22 mm, canto esquerdo a 6 mm do lado"
    validations:
      required: true
  - type: textarea
    id: botoes
    attributes:
      label: Botões
      description: De que lado está cada botão e a distância do topo ao início e ao fim de cada um.
      placeholder: |
        Power: lado direito, do topo 40 a 55 mm
        Volume: lado esquerdo, do topo 30 a 60 mm
    validations:
      required: true
  - type: input
    id: teclado
    attributes:
      label: Teclado
      description: Usas o Rii Mini X1 ou outro?
      placeholder: "Rii Mini X1"
  - type: textarea
    id: fotos
    attributes:
      label: Fotos
      description: Arrasta para aqui fotos das costas e dos lados do telemóvel (com uma régua ao lado, se possível).
  - type: textarea
    id: extra
    attributes:
      label: Mais alguma coisa?
